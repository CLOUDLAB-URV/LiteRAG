# ═══════════════════════════════════════════════════════════════════════════
# LiteRAG Configuration - All Parameters
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Required Configuration
# ─────────────────────────────────────────────────────────────────────────────
data_dir: "example-data/doc40/output"
api_key: "GEMINI_API_KEY"

# ─────────────────────────────────────────────────────────────────────────────
# Model Configuration
# ─────────────────────────────────────────────────────────────────────────────
llm_model: "models/gemini-2.5-flash-lite"
embedding_model: "models/gemini-embedding-001"

# ─────────────────────────────────────────────────────────────────────────────
# LiteLLM Proxy Settings
# ─────────────────────────────────────────────────────────────────────────────
use_litellm: False
litellm_base_url: "http://localhost:4000/v1"

# ─────────────────────────────────────────────────────────────────────────────
# LanceDB Vector Store (auto-detected from data_dir)
# ─────────────────────────────────────────────────────────────────────────────
# lancedb_uri: null  # Auto-detected from data_dir/lancedb

# ─────────────────────────────────────────────────────────────────────────────
# Query Processing
# ─────────────────────────────────────────────────────────────────────────────
enable_query_expansion: false  # Use LLM to expand query

# ─────────────────────────────────────────────────────────────────────────────
# Anchor Discovery (Phase 1)
# ─────────────────────────────────────────────────────────────────────────────
max_anchors: 8              # Maximum number of starting points
min_anchor_score: 0.30      # Minimum score threshold

# Strategy weights (should sum to 1.0)
semantic_weight: 0.40
keyword_exact_weight: 0.30
keyword_fuzzy_weight: 0.15
community_weight: 0.15

# ─────────────────────────────────────────────────────────────────────────────
# Graph Exploration (Phase 2)
# ─────────────────────────────────────────────────────────────────────────────
max_exploration_depth: 3            # Maximum hops from anchor
min_relevance_threshold: 0.25       # Base floor in the dynamic threshold
relevance_decay_factor: 0.70        # Relevance decay per hop
max_nodes_per_anchor: 50            # Limit nodes explored per anchor
max_neighbors_per_hop: 10           # Limit neighbors to explore per node

degree_influence: 0.05              # Hub penalty strength
community_cohesion_weight: 0.80     # Protection factor for within-community hubs
signal_amplification_factor: 0.25   # Scaling factor for strong initial anchors

# ─────────────────────────────────────────────────────────────────────────────
# Consensus Ranking (Phase 3)
# ─────────────────────────────────────────────────────────────────────────────
max_ranked_entities: 50         # Maximum entities to rank

# Scoring weights (should sum to 1.0)
intersection_weight: 0.30       # Found by multiple independent anchor paths
consensus_semantic_weight: 0.25 # Semantic relevance to query
proximity_weight: 0.25          # Topological proximity to anchor set
structural_weight: 0.20         # Centrality (PageRank/Betweenness)

anchor_boost: 1.5               # Multiplier for anchor entities

# ─────────────────────────────────────────────────────────────────────────────
# Context Assembly (Phase 4)
# ─────────────────────────────────────────────────────────────────────────────
max_context_tokens: 10000        # Token budget for context (increased for Text Units)

# ─────────────────────────────────────────────────────────────────────────────
# Response Generation
# ─────────────────────────────────────────────────────────────────────────────
response_temperature: 0.7
max_response_tokens: 2000

# ─────────────────────────────────────────────────────────────────────────────
# Embedding Configuration
# ─────────────────────────────────────────────────────────────────────────────
embedding_batch_size: 100
